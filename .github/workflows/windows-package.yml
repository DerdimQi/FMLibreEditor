name: Windows installer and executable

on:
  push:
    branches:
      - feature/manual-squad-excel-export
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install interface dependencies
        working-directory: app
        run: npm ci

      - name: Configure unsigned Windows package
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -NoNewline app/src-tauri/tauri.unsigned.conf.json

      - name: Build installer and executable
        timeout-minutes: 60
        working-directory: app
        run: npx tauri build --bundles nsis --config src-tauri/tauri.unsigned.conf.json

      - name: Package Windows downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced." }
          Copy-Item $setup.FullName out/FMLibreEditor-Setup.exe
          Copy-Item target/release/FMLibreEditor.exe out/FMLibreEditor.exe
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FMLibreEditor-Windows
          path: out/*
          if-no-files-found: error
          retention-days: 14
